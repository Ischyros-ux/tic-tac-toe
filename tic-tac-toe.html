<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic-Tac-Toe</title>
<style>
  :root {
    --bg-dark: #1a1d29;
    --bg-panel: #222639;
    --bg-cell: #272b3d;
    --bg-cell-hover: #323750;
    --bg-cell-win: #3a4a3a;
    --fg-x: #00d9ff;
    --fg-o: #ff4ecb;
    --fg-text: #e6e6f0;
    --fg-muted: #8b8fa3;
    --accent: #7b5cff;
    --accent-hover: #6747e0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-dark);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--fg-text);
  }

  .app {
    width: 380px;
    background: var(--bg-dark);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .status-bar {
    background: var(--bg-panel);
    padding: 18px;
    text-align: center;
  }

  .status-bar span {
    font-size: 16px;
    font-weight: 700;
    color: var(--fg-x);
    transition: color 0.2s;
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 6px;
  }

  .score-x { color: var(--fg-x); font-size: 13px; font-weight: 600; }
  .score-draw { color: var(--fg-muted); font-size: 13px; }
  .score-o { color: var(--fg-o); font-size: 13px; font-weight: 600; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 20px;
  }

  .cell {
    aspect-ratio: 1;
    background: var(--bg-cell);
    border: none;
    border-radius: 12px;
    font-size: 48px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .cell:hover:not(.filled) {
    background: var(--bg-cell-hover);
  }

  .cell.filled {
    cursor: default;
  }

  .cell.x-mark { color: var(--fg-x); }
  .cell.o-mark { color: var(--fg-o); }

  .cell.win {
    background: var(--bg-cell-win) !important;
    animation: pulse 0.5s ease;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .cell.pop {
    animation: pop 0.18s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0.4; }
    100% { transform: scale(1); opacity: 1; }
  }

  .footer {
    display: flex;
    justify-content: center;
    padding: 4px 20px 22px;
  }

  .reset-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
    font-family: inherit;
  }

  .reset-btn:hover {
    background: var(--accent-hover);
  }

  /* Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-card {
    background: var(--bg-panel);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 30px 36px;
    text-align: center;
    transform: scale(0.85);
    transition: transform 0.25s ease;
    min-width: 260px;
  }

  .overlay.show .overlay-card {
    transform: scale(1);
  }

  .overlay-emoji {
    font-size: 38px;
    margin-bottom: 6px;
  }

  .overlay-title {
    font-size: 24px;
    font-weight: 800;
    margin: 6px 0;
  }

  .overlay-sub {
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 18px;
  }

  .overlay-ok {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 24px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .overlay-ok:hover {
    background: var(--accent-hover);
  }
</style>
</head>
<body>

<div class="app">
  <div class="status-bar">
    <span id="statusText">Player X's turn</span>
  </div>

  <div class="score-row">
    <span class="score-x" id="scoreX">X: 0</span>
    <span class="score-draw" id="scoreDraw">Draws: 0</span>
    <span class="score-o" id="scoreO">O: 0</span>
  </div>

  <div class="board" id="board"></div>

  <div class="footer">
    <button class="reset-btn" id="resetBtn">↻ Reset / Play Again</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlayEmoji">🏆</div>
    <div class="overlay-title" id="overlayTitle">Player X Wins!</div>
    <div class="overlay-sub">Tap OK to play again</div>
    <button class="overlay-ok" id="overlayOk">OK</button>
  </div>
</div>

<script>
  // ---- Game state ----
  let board = Array(9).fill("");
  let currentPlayer = "X";
  let gameOver = false;
  const scores = { X: 0, O: 0, Draws: 0 };

  const boardEl = document.getElementById("board");
  const statusText = document.getElementById("statusText");
  const scoreXEl = document.getElementById("scoreX");
  const scoreOEl = document.getElementById("scoreO");
  const scoreDrawEl = document.getElementById("scoreDraw");
  const overlay = document.getElementById("overlay");
  const overlayEmoji = document.getElementById("overlayEmoji");
  const overlayTitle = document.getElementById("overlayTitle");

  // All 8 possible winning lines: 3 rows, 3 columns, 2 diagonals
  const WIN_LINES = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6],
  ];

  // ---- Build the 9 cell buttons once ----
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.addEventListener("click", () => handleClick(i));
    boardEl.appendChild(cell);
    cells.push(cell);
  }

  function handleClick(index) {
    // Ignore clicks on filled cells or after the game has ended
    if (board[index] !== "" || gameOver) return;

    board[index] = currentPlayer;
    const cell = cells[index];
    cell.textContent = currentPlayer;
    cell.classList.add("filled", "pop", currentPlayer === "X" ? "x-mark" : "o-mark");

    const winningLine = checkWinner();
    if (winningLine) {
      endGame(currentPlayer, winningLine);
      return;
    }

    if (!board.includes("")) {
      endGame(null, null); // board full -> draw
      return;
    }

    switchTurn();
  }

  // Alternates currentPlayer between 'X' and 'O' and updates the status bar
  function switchTurn() {
    currentPlayer = currentPlayer === "X" ? "O" : "X";
    statusText.textContent = `Player ${currentPlayer}'s turn`;
    statusText.style.color = currentPlayer === "X" ? "var(--fg-x)" : "var(--fg-o)";
  }

  // Checks all 8 lines for three matching, non-empty marks
  function checkWinner() {
    for (const [a, b, c] of WIN_LINES) {
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return [a, b, c];
      }
    }
    return null;
  }

  function endGame(winner, line) {
    gameOver = true;

    if (winner) {
      line.forEach(idx => cells[idx].classList.add("win"));
      scores[winner]++;
      statusText.textContent = `Player ${winner} wins! 🎉`;
      statusText.style.color = winner === "X" ? "var(--fg-x)" : "var(--fg-o)";
    } else {
      scores.Draws++;
      statusText.textContent = "It's a draw!";
      statusText.style.color = "var(--fg-muted)";
    }

    updateScores();
    showOverlay(winner);
  }

  function updateScores() {
    scoreXEl.textContent = `X: ${scores.X}`;
    scoreOEl.textContent = `O: ${scores.O}`;
    scoreDrawEl.textContent = `Draws: ${scores.Draws}`;
  }

  function showOverlay(winner) {
    if (winner) {
      overlayEmoji.textContent = "🏆";
      overlayTitle.textContent = `Player ${winner} Wins!`;
      overlayTitle.style.color = winner === "X" ? "var(--fg-x)" : "var(--fg-o)";
    } else {
      overlayEmoji.textContent = "🤝";
      overlayTitle.textContent = "It's a Draw!";
      overlayTitle.style.color = "var(--fg-muted)";
    }
    overlay.classList.add("show");
  }

  function resetBoard() {
    board = Array(9).fill("");
    currentPlayer = "X";
    gameOver = false;

    cells.forEach(cell => {
      cell.textContent = "";
      cell.className = "cell"; // strips filled/x-mark/o-mark/win/pop classes
    });

    statusText.textContent = "Player X's turn";
    statusText.style.color = "var(--fg-x)";
    overlay.classList.remove("show");
  }

  document.getElementById("resetBtn").addEventListener("click", resetBoard);
  document.getElementById("overlayOk").addEventListener("click", resetBoard);
</script>

</body>
</html>
